<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Morten Frandsen</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var saved = localStorage.getItem("theme");
          var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.dataset.theme = saved || preferred;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <script src="/assets/js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="Morten Frandsen, home">
          MF<span class="brand-dot">.</span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/">Home</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/#contact">Contact</a>
        </nav>

        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Toggle color theme"
        >
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.4 14.5A8.5 8.5 0 1 1 9.5 3.6a7 7 0 0 0 10.9 10.9Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="container not-found">
        <div>
          <p class="not-found__code">404</p>
          <h1>This page took a wrong turn</h1>
          <p class="lede">
            The page you're looking for doesn't exist, or it moved somewhere else.
          </p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="/">Back to home</a>
            <a class="btn btn-secondary" href="/blog/">Read the blog</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span class="year">2026</span> Morten Frandsen. Built with HTML, CSS and a little JavaScript.</p>
        <nav aria-label="Footer navigation">
          <a href="/">Home</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
